<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Compiler - Code Editor</title>

    <link rel="stylesheet" href="../assets/css/style.css?v=20260708">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
</head>

<body>

<nav class="navbar">
    <div class="container">

        <div class="logo">
            <h1>🤖 RL Compiler</h1>
        </div>

        <ul class="nav-menu">
            <li><a href="../index.html">Home</a></li>
            <li><a href="compiler.html" class="active">Compiler</a></li>
            <li><a href="demo.html">Demos</a></li>
            <li><a href="training.html">Training</a></li>
        </ul>

    </div>
</nav>

<div class="compiler-container">

    <div class="editor-section">

        <div class="section-header">
            <h3>Code Editor</h3>

            <div class="editor-controls">
                <button id="clearBtn" class="btn-small">Clear</button>
                <button id="executeBtn" class="btn-small btn-primary">
                    Execute
                </button>
            </div>

        </div>

<textarea id="codeEditor" placeholder="Write Python code here...">print("Hello Vanshika")</textarea>

    </div>

    <div class="output-section">

        <div class="section-header">
            <h3>Output</h3>

            <button id="clearOutputBtn" class="btn-small">
                Clear Output
            </button>

        </div>

        <div id="output" class="output-box">
            <p class="info">Execute code to see output...</p>
        </div>

        <div id="suggestionBox" class="suggestion-box hidden">
            <h4>Suggestions</h4>
            <ul id="suggestionList"></ul>
        </div>

    </div>

</div>

<section class="code-templates">

    <div class="container">

        <h3>Code Templates</h3>

        <div class="template-grid">

            <div class="template-card" onclick="loadTemplate('qlearning')">
                <h4>Q Learning</h4>
                <p>Classic RL Example</p>
            </div>

            <div class="template-card" onclick="loadTemplate('sarsa')">
                <h4>SARSA</h4>
                <p>SARSA Example</p>
            </div>

            <div class="template-card" onclick="loadTemplate('policy-gradient')">
                <h4>Policy Gradient</h4>
                <p>Policy Gradient Example</p>
            </div>

        </div>

    </div>

</section>

<footer class="footer">
    <div class="container">
        <p>© 2026 RL Compiler</p>
    </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>

<!-- API -->
<script src="../assets/js/api-integration.js?v=20261119"></script>

<!-- Compiler -->
<script src="../assets/js/compiler.js?v=20261015"></script>

</body>
</html>
